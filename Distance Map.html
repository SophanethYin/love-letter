<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1)}
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block;width:100%;height:auto}

/* Everything below is idle until the map scrolls into view (.play on <svg>). */
.land{opacity:0;transform-box:fill-box;transform-origin:center;transition:fill .5s ease}
.play .land{animation:landIn .9s var(--ease) both;animation-delay:calc(var(--i) * 6ms)}
.land.hot{fill:#E8A6B4}
.land.hot:hover{fill:#D98A9C}
.land:not(.hot):hover{fill:#EBCBC3}
@keyframes landIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

.arc{fill:none;stroke:#5B3A2B;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.play .arc{animation:dash 2.6s .9s cubic-bezier(.65,0,.35,1) forwards}
@keyframes dash{to{stroke-dashoffset:0}}

.pin{opacity:0;transform-box:fill-box;transform-origin:center}
.play .pin{animation:pop .8s var(--ease) both;animation-delay:var(--d)}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.halo{opacity:0;transform-box:fill-box;transform-origin:center}
.play .halo{animation:ripple 2.4s ease-out infinite both;animation-delay:calc(var(--d) + .6s)}
@keyframes ripple{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.city{cursor:default}
.city .dot{transform-box:fill-box;transform-origin:center;transition:transform .4s var(--ease)}
.city:hover .dot{transform:scale(1.5)}
.label{opacity:0}
.play .label{animation:fade .8s ease both;animation-delay:calc(var(--d) + .25s)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.mid{opacity:0}
.play .mid{animation:fadeOnly .8s ease 3.3s both}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
.mid text{transform-box:fill-box;transform-origin:center;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.3)}28%{transform:scale(1)}42%{transform:scale(1.18)}70%{transform:scale(1)}}

.traveler{opacity:0}
@media (prefers-reduced-motion:reduce){
  .land,.pin,.label,.mid{opacity:1!important;animation:none!important}
  .arc{stroke-dashoffset:0!important;animation:none!important}
  .halo,.mid text{animation:none!important}
}
</style>
</head><body><svg id="m" viewBox="0 0 960 480" role="img" aria-label="Map from Montréal to Banteay Meanchey"></svg>
<script>
const W=960,H=480,mtl=[-73.567,45.5017],btb=[102.9738,13.5853];
const svg=d3.select('#m');
const proj=d3.geoNaturalEarth1().rotate([-15,0]).fitExtent([[10,10],[W-10,H-10]],{type:'Sphere'});
const path=d3.geoPath(proj);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

svg.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#FBF3EF');
svg.append('path').datum(d3.geoGraticule10()).attr('d',path).attr('fill','none').attr('stroke','#F2DCD6').attr('stroke-width',.5).attr('opacity',.6);

let traveler=null,arcNode=null;

// The heart rides the arc once the line has finished drawing, then loops.
function startTraveler(){
  if(!traveler||reduced)return;
  const len=arcNode.getTotalLength();
  // CSS can't follow an SVG path, so drive the position per frame.
  const t0=performance.now()+3500,dur=6000;
  cancelAnimationFrame(startTraveler.raf);
  const step=now=>{
    const k=((now-t0)%(dur+1200))/dur;
    if(now>=t0&&k<=1){
      const e=d3.easeCubicInOut(k),p=arcNode.getPointAtLength(e*len);
      traveler.attr('transform',`translate(${p.x},${p.y})`).attr('opacity',Math.min(1,k*8,(1-k)*8));
    }else traveler.attr('opacity',0);
    startTraveler.raf=requestAnimationFrame(step);
  };
  startTraveler.raf=requestAnimationFrame(step);
}
function stopTraveler(){cancelAnimationFrame(startTraveler.raf);traveler&&traveler.attr('opacity',0)}

function show(){
  // Restart every CSS animation from scratch so each scroll-in feels fresh.
  svg.classed('play',false);
  void svg.node().getBoundingClientRect();
  svg.classed('play',true);
  startTraveler();
}
function hide(){svg.classed('play',false);stopTraveler()}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(t=>{
  const land=topojson.feature(t,t.objects.countries);
  svg.append('g').selectAll('path').data(land.features).join('path').attr('d',path)
    .attr('class',d=>'land'+((d.properties.name==='Canada'||d.properties.name==='Cambodia')?' hot':''))
    .style('--i',(d,i)=>i)
    .attr('fill',d=>(d.properties.name==='Canada'||d.properties.name==='Cambodia')?null:'#F2DCD6')
    .attr('stroke','#FBF3EF').attr('stroke-width',.6);

  arcNode=svg.append('path').datum({type:'LineString',coordinates:[mtl,btb]}).attr('d',path).attr('class','arc').node();
  const len=arcNode.getTotalLength();
  svg.style('--len',len);

  const mid=proj(d3.geoInterpolate(mtl,btb)(.5));
  svg.append('g').attr('class','mid').attr('transform',`translate(${mid})`)
    .append('text').text('♥').attr('text-anchor','middle').attr('dy','.35em').attr('font-size',34).attr('fill','#C9727F');

  traveler=svg.append('text').attr('class','traveler').text('♥').attr('text-anchor','middle').attr('dy','.35em')
    .attr('font-size',16).attr('fill','#C9727F').attr('stroke','#FBF3EF').attr('stroke-width',2).attr('paint-order','stroke');

  [[mtl,'Montréal','end',-14,'0s'],[btb,'Banteay Meanchey','start',14,'.5s']].forEach(([c,n,a,dx,d])=>{
    const [x,y]=proj(c);
    const g=svg.append('g').attr('class','city').style('--d',d);
    g.append('circle').attr('class','halo').attr('cx',x).attr('cy',y).attr('r',11).attr('fill','#C9727F').attr('opacity',.25);
    g.append('g').attr('class','pin').append('circle').attr('class','dot').attr('cx',x).attr('cy',y).attr('r',5.5).attr('fill','#5B3A2B').attr('stroke','#fff').attr('stroke-width',2);
    g.append('text').attr('class','label').text(n).attr('x',x+dx).attr('y',y+5).attr('text-anchor',a)
      .attr('font-family','Jost,sans-serif').attr('font-weight',500).attr('font-size',18).attr('fill','#3E261C')
      .attr('paint-order','stroke').attr('stroke','#FBF3EF').attr('stroke-width',4);
  });

  // Play when scrolled into view, reset when it leaves, so scrolling back replays it.
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?show():hide()),{threshold:.35}).observe(svg.node());
  }else show();
}).catch(()=>{svg.classed('play',true)});
</script></body></html>
